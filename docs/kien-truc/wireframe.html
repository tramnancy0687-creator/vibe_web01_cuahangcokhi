<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe Thành Phát</title>
<style>
/* Bố cục: danh sách màn hình bên trái, khung wireframe ở giữa, ghi chú bên dưới */
:root {
  --paper: #f4f4f1;
  --ink: #23262a;
  --muted: #6b7076;
  --wf-line: #3a3d42;
  --wf-fill: #e3e4e2;
  --wf-soft: #f0f0ee;
  --mark: #d9480f;
  --ok: #2f7d4f;
  --warn: #b7791f;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: Consolas, "SF Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }

.doc-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding: 16px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid #d6d7d3; background: #fff; }
.doc-head h1 { margin: 0; font-size: 18px; font-weight: 600; }
.doc-head h1 span { color: var(--muted); font-weight: 400; }
.roles { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.roles button { border: 1px solid #c9cac6; background: #fff; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.roles button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 62px); }
.screens { border-right: 1px solid #d6d7d3; padding: 16px; background: #fbfbf9; }
.screens h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.screens h3:first-child { margin-top: 0; }
.screens a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; }
.screens a:hover { background: #ecece8; }
.screens a.active { background: var(--ink); color: #fff; }
.screens a small { font-family: var(--mono); font-size: 11px; opacity: .65; white-space: nowrap; }
.screens a.locked { color: #a5a8ab; }

main { padding: 24px max(16px, env(safe-area-inset-right)) 48px 24px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.meta h2 { margin: 0; font-size: 22px; }
.meta .uc { font-family: var(--mono); font-size: 12px; color: var(--mark); }
.meta .who { font-size: 13px; color: var(--muted); }

.stage { overflow-x: auto; padding-bottom: 4px; }
.device { min-width: 960px; max-width: 1180px; border: 2px solid var(--wf-line); border-radius: 8px; background: #fff; overflow: hidden; }
.device.bare { background: var(--wf-soft); }
.browser { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1.5px solid var(--wf-line); background: var(--wf-fill); font-family: var(--mono); font-size: 11px; color: var(--muted); }
.browser i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--wf-line); }
.browser span { margin-left: 10px; padding: 1px 10px; border: 1px solid #b9bbb8; border-radius: 4px; background: #fff; flex: 1; }
.app { display: grid; grid-template-columns: 180px 1fr; min-height: 560px; }
.topbar { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1.5px solid var(--wf-line); }
.logo { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.logo i { width: 26px; height: 26px; border: 1.5px solid var(--wf-line); background: repeating-linear-gradient(45deg, var(--wf-fill) 0 4px, #fff 4px 8px); }
.userbox { display: flex; gap: 12px; align-items: center; font-size: 13px; }
.side { border-right: 1.5px solid var(--wf-line); padding: 12px 8px; display: grid; gap: 2px; align-content: start; background: var(--wf-soft); }
.side a { padding: 6px 10px; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: 13px; }
.side a.active { background: var(--wf-line); color: #fff; }
.content { padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.denied { padding: 48px 16px; text-align: center; color: var(--muted); }

/* Các khối wireframe */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.cols { display: grid; gap: 14px; }
.c2 { grid-template-columns: 1fr 1fr; }
.c-73 { grid-template-columns: 1.15fr 1fr; }
.c-37 { grid-template-columns: 300px 1fr; }
.c4 { grid-template-columns: repeat(4, 1fr); }
.panel { border: 1.5px solid var(--wf-line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel > h4 { margin: 0; font-size: 14px; }
.h { font-weight: 600; font-size: 16px; }
.sub { color: var(--muted); font-size: 12px; }
.btn { display: inline-block; border: 1.5px solid var(--wf-line); border-radius: 4px; padding: 5px 12px; background: #fff; font-size: 13px; white-space: nowrap; }
.btn.pri { background: var(--wf-line); color: #fff; }
.btn.sm { padding: 1px 8px; font-size: 12px; }
.inp { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; border: 1.5px solid #8b8e92; border-radius: 4px; padding: 5px 10px; min-width: 140px; color: var(--muted); background: #fff; font-size: 13px; }
.inp.wide { flex: 1; min-width: 200px; }
.inp.full { width: 100%; }
.inp.sel::after { content: "▾"; }
.inp.err { border-color: var(--mark); }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field .inp { color: var(--ink); }
.radio { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.radio i { width: 13px; height: 13px; border: 1.5px solid var(--wf-line); border-radius: 50%; }
.radio i.on { background: radial-gradient(var(--wf-line) 0 3px, #fff 3.5px); }
.check i { border-radius: 2px; }
.check i.on { background: var(--wf-line); }
.tabs { display: flex; gap: 0; border-bottom: 1.5px solid var(--wf-line); flex-wrap: wrap; }
.tabs span { padding: 6px 14px; font-size: 13px; border: 1.5px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; margin-bottom: -1.5px; cursor: pointer; }
.tabs span.on { border-color: var(--wf-line); background: #fff; font-weight: 600; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { border: 1px solid #a9acaf; padding: 5px 8px; text-align: left; vertical-align: middle; }
table.t th { background: var(--wf-fill); font-weight: 600; font-size: 12px; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.hl td { background: #fff3e6; }
table.t tr.sel td { background: #e9eef5; }
.tag { display: inline-block; padding: 0 8px; border: 1px solid currentColor; border-radius: 999px; font-size: 11px; }
.tag.warn { color: var(--warn); }
.tag.bad { color: var(--mark); }
.tag.ok { color: var(--ok); }
.stat { border: 1.5px solid var(--wf-line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.img { border: 1.5px solid var(--wf-line); background: linear-gradient(to top right, transparent calc(50% - 1px), #a9acaf, transparent calc(50% + 1px)), linear-gradient(to top left, transparent calc(50% - 1px), #a9acaf, transparent calc(50% + 1px)); min-height: 140px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.img span { background: #fff; padding: 0 6px; }
.total { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 13px; }
.total b { text-align: right; font-variant-numeric: tabular-nums; }
.total .big { font-size: 17px; }
.hint { font-size: 12px; color: var(--muted); border-left: 3px solid #c9cac6; padding-left: 8px; }
.error { color: var(--mark); font-size: 12px; }
.login { display: grid; place-items: center; min-height: 560px; }
.login .panel { width: 360px; background: #fff; padding: 24px; gap: 14px; }

/* Đánh dấu ghi chú */
.mk { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--mark); color: #fff; font: 600 11px var(--font); font-style: normal; vertical-align: middle; flex: none; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 900px; counter-reset: n; }
.notes li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; counter-increment: n; }
.notes li::before { content: counter(n); display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--mark); color: #fff; font-size: 11px; font-weight: 600; margin-top: 2px; }
.notes b { font-weight: 600; }
.notes code { font-family: var(--mono); font-size: 12px; color: var(--mark); }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .screens { border-right: 0; border-bottom: 1px solid #d6d7d3; }
  main { padding-left: max(16px, env(safe-area-inset-left)); }
}
</style>
</head>
<body>

<header class="doc-head">
  <h1>Wireframe <span>· Website quản lý cửa hàng cơ khí Thành Phát</span></h1>
  <div class="roles" role="group" aria-label="Xem với vai trò">
    Xem với vai trò:
    <button type="button" data-role="CH" aria-pressed="true">Chủ cửa hàng</button>
    <button type="button" data-role="NV" aria-pressed="false">NV bán hàng</button>
    <button type="button" data-role="TK" aria-pressed="false">Thủ kho</button>
  </div>
</header>

<div class="layout">
  <nav class="screens" id="nav" aria-label="Danh sách màn hình"></nav>
  <main>
    <div class="meta"><h2 id="m-title"></h2><span class="uc" id="m-uc"></span><span class="who" id="m-who"></span></div>
    <div class="stage"><div class="device" id="device"></div></div>
    <ol class="notes" id="notes"></ol>
  </main>
</div>

<!-- ============ MÀN HÌNH ============ -->

<template id="s-login" data-title="Đăng nhập" data-uc="UC-01" data-roles="CH NV TK" data-group="Tài khoản" data-bare>
  <div class="login">
    <div class="panel">
      <div class="logo" style="justify-content:center"><i></i>THÀNH PHÁT</div>
      <div class="sub" style="text-align:center">Quản lý bán hàng · kho · công nợ</div>
      <div class="field">Tên đăng nhập<span class="inp full">lan.nv</span></div>
      <div class="field">Mật khẩu<span class="inp full err">••••••••</span></div>
      <div class="error"><i class="mk">1</i> Sai tên đăng nhập hoặc mật khẩu.</div>
      <span class="btn pri" style="text-align:center">Đăng nhập</span>
      <div class="sub" style="text-align:center"><i class="mk">2</i> Quên mật khẩu? Liên hệ chủ cửa hàng.</div>
    </div>
  </div>
  <ol class="notes">
    <li>Báo lỗi chung, không nói rõ sai tên hay sai mật khẩu. Khóa tạm sau 5 lần sai liên tiếp.</li>
    <li>Không có tự đăng ký hay tự lấy lại mật khẩu: chủ cửa hàng tạo và đặt lại mật khẩu ở màn hình <b>Tài khoản nhân viên</b>.</li>
    <li>Đăng nhập xong chuyển về <b>Trang chủ</b>; menu bên trái chỉ hiện chức năng đúng vai trò (thử đổi vai trò ở góc trên).</li>
  </ol>
</template>

<template id="s-home" data-title="Trang chủ" data-uc="UC-20 · UC-17" data-roles="CH NV TK" data-group="Chung">
  <div class="row between"><div><div class="h">Xin chào</div><div class="sub">Thứ Hai, 02/11/2026</div></div>
    <div class="row">
      <span class="btn pri" data-roles="CH NV">+ Lập phiếu bán</span>
      <span class="btn" data-roles="CH TK">+ Phiếu nhập</span>
      <span class="btn" data-roles="CH TK">Kiểm kê</span>
    </div>
  </div>
  <div class="cols c4">
    <div class="stat" data-roles="CH"><span class="sub">Doanh thu hôm nay</span><b>14.820.000</b><span class="sub">38 phiếu</span></div>
    <div class="stat" data-roles="NV"><span class="sub">Phiếu của tôi hôm nay</span><b>17</b><span class="sub">6.540.000 đ</span></div>
    <div class="stat" data-roles="CH"><span class="sub">Công nợ phải thu</span><b>63.210.000</b><span class="sub">9 khách thầu</span></div>
    <div class="stat"><span class="sub">Hàng sắp hết <i class="mk">1</i></span><b>5 món</b><span class="sub">dưới mức tối thiểu</span></div>
    <div class="stat" data-roles="TK"><span class="sub">Phiếu nhập tháng này</span><b>12</b><span class="sub">4 nhà cung cấp</span></div>
  </div>
  <div class="cols c2">
    <div class="panel"><h4>Hàng sắp hết</h4>
      <table class="t"><tr><th>Món</th><th class="n">Tồn</th><th class="n">Tối thiểu</th></tr>
        <tr><td>Ốc vít M8 x 30</td><td class="n">1,2 kg</td><td class="n">5 kg</td></tr>
        <tr><td>Dây điện Cadivi 2.5</td><td class="n">40 m</td><td class="n">200 m</td></tr>
        <tr><td>Que hàn 3.2 ly</td><td class="n">2 hộp</td><td class="n">10 hộp</td></tr>
      </table>
    </div>
    <div class="panel" data-roles="CH"><h4>Nợ quá 30 ngày <i class="mk">2</i></h4>
      <table class="t"><tr><th>Khách</th><th class="n">Còn nợ</th><th>Nợ từ</th></tr>
        <tr><td>Anh Tư (thầu Q.7)</td><td class="n">18.450.000</td><td>03/09/2026</td></tr>
        <tr><td>Cty XD Phú Lộc</td><td class="n">9.100.000</td><td>21/09/2026</td></tr>
      </table>
    </div>
    <div class="panel" data-roles="NV TK"><h4>Lối tắt</h4><div class="sub">Tra cứu nhanh: gõ tên hoặc mã món</div><span class="inp full">🔍 vd. M8, cadivi…</span></div>
  </div>
  <ol class="notes">
    <li>Cảnh báo hàng sắp hết lấy theo mức tồn tối thiểu khai báo trong <b>Hàng hóa</b> (UC-20). Bấm vào để xem báo cáo đầy đủ.</li>
    <li>Chỉ chủ thấy doanh thu toàn cửa hàng và công nợ; nhân viên chỉ thấy số phiếu của chính mình.</li>
    <li>Nút lối tắt thay đổi theo vai trò: NV bán thấy "Lập phiếu bán", thủ kho thấy "Phiếu nhập" và "Kiểm kê".</li>
  </ol>
</template>

<template id="s-pos" data-title="Bán hàng" data-uc="UC-06 · UC-07 · UC-08 · UC-09" data-roles="CH NV" data-group="Bán hàng">
  <div class="cols c-73">
    <div class="panel"><h4>Tra cứu hàng hóa <i class="mk">1</i></h4>
      <span class="inp full">🔍 ốc m8</span>
      <table class="t">
        <tr><th>Mã</th><th>Tên</th><th class="n">Tồn</th><th class="n">Giá lẻ</th><th class="n">Giá sỉ</th><th></th></tr>
        <tr class="sel"><td>OV-M8-30</td><td>Ốc vít M8 x 30</td><td class="n">1,2 kg<br><span class="sub">≈ 192 con</span></td><td class="n">500 / con</td><td class="n">70.000 / kg</td><td><span class="btn sm">Thêm</span></td></tr>
        <tr><td>OV-M8-50</td><td>Ốc vít M8 x 50</td><td class="n">6 kg</td><td class="n">700 / con</td><td class="n">72.000 / kg</td><td><span class="btn sm">Thêm</span></td></tr>
        <tr><td>BL-M8</td><td>Bu lông M8 + tán</td><td class="n">0 con</td><td class="n">1.200 / con</td><td class="n">—</td><td><span class="tag bad">Hết</span></td></tr>
      </table>
      <div class="hint">Gõ tên, mã hoặc quét mã vạch. Hàng hết vẫn hiện để báo khách, nhưng không thêm vào phiếu được.</div>
    </div>
    <div class="panel"><div class="row between"><h4>Phiếu bán PB-2026-1102-018</h4><span class="sub">NV: Lan <i class="mk">5</i></span></div>
      <div class="row"><span class="field" style="flex:1">Khách hàng <i class="mk">2</i><span class="inp sel full">Anh Tư (thầu Q.7) · đang nợ 18.450.000</span></span></div>
      <table class="t">
        <tr><th>Món</th><th class="n">SL</th><th>Đơn vị <i class="mk">3</i></th><th class="n">Thành tiền</th><th></th></tr>
        <tr><td>Ốc vít M8 x 30</td><td class="n">1</td><td><span class="inp sel" style="min-width:70px">kg</span></td><td class="n">70.000</td><td>✕</td></tr>
        <tr><td>Dây điện Cadivi 2.5</td><td class="n">25</td><td><span class="inp sel" style="min-width:70px">mét</span></td><td class="n">237.500</td><td>✕</td></tr>
        <tr><td>Xi măng Hà Tiên</td><td class="n">10</td><td><span class="inp sel" style="min-width:70px">bao</span></td><td class="n">890.000</td><td>✕</td></tr>
      </table>
      <div class="hint">1 kg ốc M8 x 30 = 160 con → trừ kho 160 con.</div>
      <div class="total"><span>Tổng tiền</span><b class="big">1.197.500</b></div>
      <div class="row">Thanh toán <i class="mk">4</i>
        <span class="radio"><i></i>Trả ngay</span>
        <span class="radio"><i class="on"></i>Ghi nợ</span>
      </div>
      <div class="row between"><span class="btn">Hủy phiếu</span><span class="btn pri">Lưu & in phiếu</span></div>
    </div>
  </div>
  <ol class="notes">
    <li><b>UC-06</b> Tra cứu: tồn hiển thị theo đơn vị gốc kèm số quy đổi, giá lẻ và giá sỉ đặt cạnh nhau để báo giá ngay.</li>
    <li>Mặc định là <b>Khách lẻ</b>. Chọn nhà thầu thì hiện số nợ hiện tại để nhân viên biết trước khi cho mua chịu.</li>
    <li><b>UC-09</b> Mỗi dòng chọn đơn vị bán (con / kg, mét / cuộn); giá và số trừ kho tự quy đổi theo tỉ lệ trong danh mục hàng hóa.</li>
    <li><b>UC-08</b> "Ghi nợ" chỉ bật khi khách là nhà thầu được mua chịu. Khách lẻ chỉ có "Trả ngay".</li>
    <li>Nhân viên bán tự lấy từ tài khoản đăng nhập, không chọn tay, để báo cáo doanh số theo nhân viên đúng.</li>
  </ol>
</template>

<template id="s-return" data-title="Nhận hàng trả lại" data-uc="UC-10 · UC-11" data-roles="CH NV" data-group="Công nợ & trả hàng">
  <div class="row"><span class="inp wide">🔍 Số phiếu bán hoặc tên khách: PB-2026-1028-007</span><span class="btn">Tìm phiếu</span></div>
  <div class="panel"><div class="row between"><h4>Phiếu PB-2026-1028-007 · 28/10/2026 · Anh Tư (thầu Q.7)</h4><span class="sub">NV bán: Hùng</span></div>
    <table class="t">
      <tr><th></th><th>Món</th><th class="n">Đã mua</th><th class="n">SL trả</th><th>Còn nguyên? <i class="mk">1</i></th><th class="n">Giá trị trả</th></tr>
      <tr class="sel"><td><span class="radio check"><i class="on"></i></span></td><td>Thép hộp 40x80 dày 1.4</td><td class="n">12 cây</td><td class="n"><span class="inp" style="min-width:60px">3</span></td><td><span class="radio check"><i class="on"></i>Còn nguyên</span></td><td class="n">1.050.000</td></tr>
      <tr><td><span class="radio check"><i></i></span></td><td>Sơn chống gỉ 3L</td><td class="n">4 lon</td><td class="n">—</td><td>—</td><td class="n">—</td></tr>
    </table>
    <div class="cols c2">
      <div class="field">Lý do trả<span class="inp full">Công trình dư, khách đổi thiết kế</span></div>
      <div class="panel" style="background:var(--wf-soft)"><h4>Hoàn lại cho khách <i class="mk">2</i></h4>
        <div class="total"><span>Giá trị hàng trả</span><b>1.050.000</b><span>Trừ vào công nợ</span><b>− 1.050.000</b><span>Nợ còn lại</span><b>17.400.000</b></div>
      </div>
    </div>
    <div class="row between"><span class="sub">Hàng trả được cộng lại vào tồn kho ngay khi xác nhận.</span><span class="btn pri">Xác nhận nhận hàng</span></div>

  var USER = { CH: "Anh Phát · Chủ", NV: "Lan · NV bán hàng", TK: "Minh · Thủ kho" };
  var screens = [].slice.call(document.querySelectorAll("template[id^='s-']"));
  var role = "CH";
  var current = (location.hash || "").replace("#", "") || "s-login";
  if (!document.getElementById(current)) current = "s-login";

  function can(t) { return t.dataset.roles.split(" ").indexOf(role) >= 0; }

  function renderNav() {
    var nav = document.getElementById("nav"), html = "", last = "";
    screens.forEach(function (t) {
      if (t.dataset.group !== last) { html += "<h3>" + t.dataset.group + "</h3>"; last = t.dataset.group; }
      html += '<a href="#' + t.id + '" class="' + (t.id === current ? "active " : "") + (can(t) ? "" : "locked") + '">' +
        t.dataset.title + "<small>" + t.dataset.uc.split(" ")[0] + "</small></a>";
    });
    nav.innerHTML = html;
  }

  function render() {
    var t = document.getElementById(current);
    document.getElementById("m-title").textContent = t.dataset.title;
    document.getElementById("m-uc").textContent = t.dataset.uc;
    document.getElementById("m-who").textContent = "Vai trò được dùng: " + t.dataset.roles.split(" ").map(function (r) { return ROLE_NAME[r]; }).join(", ");

    var frag = t.content.cloneNode(true);
    var notes = frag.querySelector(".notes");
    document.getElementById("notes").innerHTML = notes ? notes.innerHTML : "";
    if (notes) notes.remove();
    frag.querySelectorAll("[data-roles]").forEach(function (el) {
      if (el.dataset.roles.split(" ").indexOf(role) < 0) el.remove();
    });

    var dev = document.getElementById("device");
    dev.className = "device" + ("bare" in t.dataset ? " bare" : "");
    dev.innerHTML = '<div class="browser"><i></i><i></i><i></i><span>thanhphat.vn/' + current.slice(2) + "</span></div>";
    if ("bare" in t.dataset) { dev.appendChild(frag); }
    else {
      var app = document.createElement("div"); app.className = "app";
      var menu = MENU.map(function (id) {
        var s = document.getElementById(id);
        return can(s) ? '<a href="#' + id + '" class="' + (id === current ? "active" : "") + '">' + s.dataset.title + "</a>" : "";
      }).join("");
      app.innerHTML = '<div class="topbar"><div class="logo"><i></i>THÀNH PHÁT</div><div class="userbox"><span>' + USER[role] +
        '</span><span class="btn sm">Đổi mật khẩu</span><a class="btn sm" href="#s-login">Đăng xuất</a></div></div><nav class="side">' + menu + '</nav><div class="content"></div>';
      var content = app.querySelector(".content");
      if (can(t)) content.appendChild(frag);
      else content.innerHTML = '<div class="denied"><div class="h">Bạn không có quyền vào màn hình này</div><p>Vai trò ' + ROLE_NAME[role] + " không được dùng chức năng " + t.dataset.title + ". Menu bên trái đã ẩn mục này.</p></div>";
      dev.appendChild(app);
    }
    var rt = dev.querySelector("#rtabs");
    if (rt) rt.addEventListener("click", function (e) {
      var k = e.target.dataset && e.target.dataset.r; if (!k) return;
      rt.querySelectorAll("span").forEach(function (s) { s.classList.toggle("on", s.dataset.r === k); });
      dev.querySelectorAll("[data-rp]").forEach(function (p) { p.hidden = p.dataset.rp !== k; });
    });
    renderNav();
  }

  window.addEventListener("hashchange", function () {
    var id = location.hash.replace("#", "");
    if (document.getElementById(id)) { current = id; render(); }
  });
  document.querySelectorAll(".roles button").forEach(function (b) {
    b.addEventListener("click", function () {
      role = b.dataset.role;
      document.querySelectorAll(".roles button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
